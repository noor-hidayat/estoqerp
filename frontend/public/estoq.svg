<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Latar belakang transparan agar menyatu dengan background perangkat -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Grup utama untuk ikon -->
  <g transform="translate(0, 0)">
    
    <!-- Bentuk Hexagon (Siluet Kotak 2D) -->
    <!-- Menggunakan stroke dengan round linejoin untuk membuat sudut membulat yang halus -->
    <polygon 
      points="256,60 429,160 429,360 256,460 83,360 83,160" 
      fill="#203354" 
      stroke="#203354" 
      stroke-width="32" 
      stroke-linejoin="round" 
    />

    <!-- Tanda Centang Hijau (Checkmark) -->
    <!-- Dipertebal dengan stroke-width besar agar terbaca jelas walau dalam ukuran ikon kecil -->
    <path 
      d="M 140 270 L 230 360 L 420 140" 
      fill="none" 
      stroke="#8CC63F" 
      stroke-width="72" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    
  </g>
</svg>
